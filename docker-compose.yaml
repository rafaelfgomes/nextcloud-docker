services:
  database:
    image: mariadb
    container_name: nextcloud-db
    hostname: nc-database
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ${NC_DATABASE_FOLDER:-./nc-database}:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    networks:
      local:

  nextcloud:
    image: lscr.io/linuxserver/nextcloud
    container_name: nextcloud-app
    hostname: nextcloud
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - REVERSE_PROXY_IP=${REVERSE_PROXY_IP}
    volumes:
      - ${NC_CONFIG_FOLDER:-./nc-config}:/config
      - ${NC_ACCOUNTS_FOLDER:-./nc-data}:/data
      - ./config.php:/config/www/nextcloud/config/config.php
    ports:
      - ${NEXTCLOUD_PORT:-443}:443
    restart: unless-stopped
    depends_on:
      - database
      - redis
    networks:
      local:
      external:
        ipv4_address: ${NEXTCLOUD_IP}

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    hostname: nc-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-passwd}
    volumes:
      - ${NC_REDIS_FOLDER:-./nc-redis}:/data
    networks:
      local:

networks:
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}
  local:
    name: nextcloud-local-network